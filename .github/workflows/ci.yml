# Dedicated CI for jooservices/server-installer — GitHub-hosted runners
# Pull-request quality gate. Post-merge heads run ci-post-merge.yml.
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check entrypoints executable
        run: |
          test -x bin/server-installer
          test -x bin/server-installer-wizard

      - name: Bash syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find bin lib wizard modules tests -type f -name '*.sh' -print0)
          bash -n bin/server-installer
          bash -n bin/server-installer-wizard

  lint:
    name: Lint
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: make lint

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --allow-no-lockfiles
            .

      # No Dependency Review (Dependency graph / GHAS not available for this repo).
      # OSV covers the Dependencies security leg.

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --exit-code 1 --config=.gitleaks.toml

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config auto --error \
              --exclude '.github' \
              --exclude 'modules/dns/pihole/module.sh'

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Module coverage map
        run: bash ./tests/run_e2e.sh coverage

      - name: Metadata validation
        run: bash ./tests/validate_metadata.sh

      - name: Preflight tests
        run: bash ./tests/preflight.sh

      - name: E2E essentials
        run: bash ./tests/run_e2e.sh essentials

      - name: E2E wizard
        run: bash ./tests/run_e2e.sh wizard

  os-matrix:
    name: OS smoke (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [lint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu24
            arch: amd64
            runner: ubuntu-latest
          - os: debian12
            arch: amd64
            runner: ubuntu-latest
          - os: rocky9
            arch: amd64
            runner: ubuntu-latest
          - os: ubuntu24
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: OS smoke E2E
        env:
          E2E_OS: ${{ matrix.os }}
        run: bash ./tests/run_e2e.sh essentials

  coverage:
    name: Coverage upload
    needs: [validate, lint, security, test, os-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate CI result
        run: |
          for result in \
            "${{ needs.validate.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.os-matrix.result }}"; do
            if [ "${result}" != "success" ]; then
              echo "CI failed: one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "CI passed (module coverage verified in Test job)"
