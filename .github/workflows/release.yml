# Tag-driven GitHub Release — dedicated; no jooservices/workflows.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Refusing release: tag commit is not on origin/master"
            exit 1
          fi

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: make lint

      - name: Module coverage
        run: bash ./tests/run_e2e.sh coverage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
