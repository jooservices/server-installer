# Ansible is an optional fleet wrapper around server-installer.
# Source of truth for install logic remains bash modules + CLI.
#
# Layout:
#   ansible.cfg
#   inventories/hosts.example.yml
#   playbooks/site.yml
#   roles/server_installer/   # copy/sync CLI + run apply
#
# Control node: needs ansible-core (module `ansible`) + SSH to targets.
# Targets: need the server-installer tree (or a release tarball) + sudo.

[defaults]
inventory = inventories/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
